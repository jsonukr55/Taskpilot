<div class="appearance">
  <button class="appearance__btn btn-icon" [class.active]="appearanceOpen()" (click)="toggle()" data-tooltip="Appearance">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/>
      <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/>
      <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>
    </svg>
  </button>

  @if (appearanceOpen()) {
    <div class="appearance__overlay" (click)="close()" (document:keydown.escape)="close()"></div>
    <div class="appearance__panel" role="dialog" aria-label="Appearance settings">
      <div class="appearance__section">
        <span class="appearance__title">Theme</span>
        <div class="appearance__modes">
          @for (m of themeModes; track m.value) {
            <button class="appearance__mode" [class.active]="theme.currentTheme() === m.value" (click)="selectMode(m.value)">
              <tp-icon [name]="m.icon" [size]="16" />
              <span>{{ m.label }}</span>
            </button>
          }
        </div>
      </div>

      <div class="appearance__section">
        <span class="appearance__title">Accent color</span>
        <div class="appearance__swatches">
          @for (p of theme.presets; track p.color) {
            <button class="appearance__swatch" [class.active]="theme.accentColor() === p.color"
                    [style.background]="p.color" [attr.aria-label]="p.name" data-tooltip [attr.data-tooltip]="p.name"
                    (click)="selectAccent(p.color)">
              @if (theme.accentColor() === p.color) {
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
              }
            </button>
          }
          <label class="appearance__swatch appearance__swatch--custom" data-tooltip="Custom">
            <input type="color" [value]="theme.accentColor()" (input)="onCustomAccent($event)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          </label>
        </div>
      </div>

      <div class="appearance__section">
        <span class="appearance__title">Interface</span>
        <button class="appearance__toggle" [class.on]="theme.glass()" role="switch"
                [attr.aria-checked]="theme.glass()" (click)="theme.toggleGlass()">
          <span class="appearance__toggle-text">
            Glass effect
            <small>Frosted, translucent panels</small>
          </span>
          <span class="appearance__switch"><span class="appearance__switch-knob"></span></span>
        </button>
      </div>
    </div>
  }
</div>
